<svg width="1400" height="480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .chart-bg { fill: #2d2d2d; }
      .stripe { fill: rgba(255,255,255,0.03); }
      .grid-line { stroke: rgba(255,255,255,0.1); stroke-width: 1; }
      .axis-line { stroke: rgba(255,255,255,0.3); stroke-width: 2; }
      .label { fill: #b0b0b0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; }
      .title { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: normal; }
      .line-elysia { stroke: #8b5cf6; fill: none; stroke-width: 2; }
      .line-kori { stroke: #3b82f6; fill: none; stroke-width: 2; }
      .line-hono { stroke: #f59e0b; fill: none; stroke-width: 2; }
      .line-fastify { stroke: #10b981; fill: none; stroke-width: 2; }
      .line-express { stroke: #ec4899; fill: none; stroke-width: 2; }
      .marker { fill: #2d2d2d; stroke-width: 2; }
    </style>
  </defs>

  <rect class="chart-bg" width="1400" height="480"/>

  <!-- Alternating stripes -->

  <!-- Grid lines -->
  <line class="grid-line" x1="100" y1="400" x2="1300" y2="400"/>
  <line class="grid-line" x1="100" y1="332" x2="1300" y2="332"/>
  <line class="grid-line" x1="100" y1="264" x2="1300" y2="264"/>
  <line class="grid-line" x1="100" y1="196" x2="1300" y2="196"/>
  <line class="grid-line" x1="100" y1="128" x2="1300" y2="128"/>
  <line class="grid-line" x1="100" y1="60" x2="1300" y2="60"/>

  <!-- Axes -->
  <line class="axis-line" x1="100" y1="60" x2="100" y2="400"/>
  <line class="axis-line" x1="100" y1="400" x2="1300" y2="400"/>

  <!-- Y-axis labels -->
  <text class="label" x="90" y="405" text-anchor="end">0%</text>
  <text class="label" x="90" y="337" text-anchor="end">20%</text>
  <text class="label" x="90" y="269" text-anchor="end">40%</text>
  <text class="label" x="90" y="201" text-anchor="end">60%</text>
  <text class="label" x="90" y="133" text-anchor="end">80%</text>
  <text class="label" x="90" y="65" text-anchor="end">100%</text>

  <!-- Y-axis title -->
  <text class="title" x="20" y="230" text-anchor="middle" transform="rotate(-90, 20, 230)">Relative Performance (%)</text>

  <!-- X-axis labels -->

  <!-- Legend -->
  <g transform="translate(100, 460)">
  </g>
</svg>