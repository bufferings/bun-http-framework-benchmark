name: Benchmark on GCP (2-VM)

on:
    workflow_dispatch:
        inputs:
            time:
                description: 'Benchmark duration in seconds'
                required: false
                default: '30'
                type: string
            connections:
                description: 'Number of concurrent connections'
                required: false
                default: '128'
                type: string
            runs:
                description: 'Number of runs per benchmark (median)'
                required: false
                default: '1'
                type: string

concurrency:
    group: benchmark-gcp-2vm
    cancel-in-progress: true

permissions:
    id-token: write
    contents: read

env:
    GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    GCP_ZONE: ${{ secrets.GCP_ZONE }}
    TARGET_VM_NAME: bench-vm-target
    LOAD_VM_NAME: bench-vm-load

jobs:
    start-vms:
        name: Start GCP VMs
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - uses: actions/checkout@v4

            - name: Authenticate to Google Cloud
              uses: google-github-actions/auth@v3
              with:
                  project_id: ${{ secrets.GCP_PROJECT_ID }}
                  workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
                  service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

            - name: Setup gcloud
              uses: google-github-actions/setup-gcloud@v3.0.1

            - name: Start target VM
              run: |
                  echo "Starting target VM: ${{ env.TARGET_VM_NAME }}"
                  gcloud compute instances start ${{ env.TARGET_VM_NAME }} \
                    --project=${{ env.GCP_PROJECT_ID }} \
                    --zone=${{ env.GCP_ZONE }}

            - name: Start load VM
              run: |
                  echo "Starting load VM: ${{ env.LOAD_VM_NAME }}"
                  gcloud compute instances start ${{ env.LOAD_VM_NAME }} \
                    --project=${{ env.GCP_PROJECT_ID }} \
                    --zone=${{ env.GCP_ZONE }}

    benchmark:
        name: Run All Benchmarks
        needs: start-vms
        runs-on: [self-hosted, bench-vm-load]
        timeout-minutes: 60

        steps:
            - uses: actions/checkout@v4

            - name: Authenticate to Google Cloud
              uses: google-github-actions/auth@v3
              with:
                  project_id: ${{ secrets.GCP_PROJECT_ID }}
                  workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
                  service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

            - name: Setup gcloud
              uses: google-github-actions/setup-gcloud@v3.0.1

            - name: Install dependencies
              run: bun install

            - name: Run benchmark
              run: |
                  TIME="${{ inputs.time || '30' }}"
                  CONNECTIONS="${{ inputs.connections || '128' }}"
                  RUNS="${{ inputs.runs || '1' }}"
                  echo "Configuration: ${TIME}s duration, ${CONNECTIONS} connections, ${RUNS} runs"
                  bun run bench-2vm-gcp.ts --time=$TIME --connections=$CONNECTIONS --runs=$RUNS
              env:
                  NODE_ENV: production
                  TARGET_VM_NAME: ${{ env.TARGET_VM_NAME }}
                  GCP_PROJECT_ID: ${{ env.GCP_PROJECT_ID }}
                  GCP_ZONE: ${{ env.GCP_ZONE }}
                  PLATFORM: GCP (2-VM)

            - name: Upload results
              uses: actions/upload-artifact@v4
              with:
                  name: benchmark-results-gcp-2vm
                  path: results/
                  retention-days: 90
              if: always()

            - name: Display results
              run: |
                  if [ -f results/results.md ] && [ -s results/results.md ]; then
                    cat results/results.md >> $GITHUB_STEP_SUMMARY
                  else
                    echo "⚠️ No results found or results file is empty" >> $GITHUB_STEP_SUMMARY
                  fi
              if: always()

    stop-vms:
        name: Stop GCP VMs
        needs: [start-vms, benchmark]
        if: always()
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - uses: actions/checkout@v4

            - name: Authenticate to Google Cloud
              uses: google-github-actions/auth@v3
              with:
                  project_id: ${{ secrets.GCP_PROJECT_ID }}
                  workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
                  service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

            - name: Setup gcloud
              uses: google-github-actions/setup-gcloud@v3.0.1

            - name: Stop target VM
              run: |
                  echo "Stopping target VM: ${{ env.TARGET_VM_NAME }}"
                  gcloud compute instances stop ${{ env.TARGET_VM_NAME }} \
                    --project=${{ env.GCP_PROJECT_ID }} \
                    --zone=${{ env.GCP_ZONE }} || true

            - name: Stop load VM
              run: |
                  echo "Stopping load VM: ${{ env.LOAD_VM_NAME }}"
                  gcloud compute instances stop ${{ env.LOAD_VM_NAME }} \
                    --project=${{ env.GCP_PROJECT_ID }} \
                    --zone=${{ env.GCP_ZONE }} || true
