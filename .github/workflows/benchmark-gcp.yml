name: Benchmark on GCP

on:
    workflow_dispatch:
        inputs:
            time:
                description: 'Benchmark duration in seconds'
                required: false
                default: '30'
                type: string
            connections:
                description: 'Number of concurrent connections'
                required: false
                default: '128'
                type: string
            runs:
                description: 'Number of runs per benchmark (median)'
                required: false
                default: '1'
                type: string

concurrency:
    group: benchmark-gcp
    cancel-in-progress: true

permissions:
    id-token: write
    contents: read

env:
    GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    GCP_ZONE: ${{ secrets.GCP_ZONE }}
    VM_NAME: bench-vm

jobs:
    start-vm:
        name: Start GCP VM
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - uses: actions/checkout@v4

            - name: Authenticate to Google Cloud
              uses: google-github-actions/auth@v3
              with:
                  project_id: ${{ secrets.GCP_PROJECT_ID }}
                  workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
                  service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

            - name: Setup gcloud
              uses: google-github-actions/setup-gcloud@v3.0.1

            - name: Start VM instance
              run: |
                  echo "Starting VM instance: ${{ env.VM_NAME }}"
                  gcloud compute instances start ${{ env.VM_NAME }} \
                    --project=${{ env.GCP_PROJECT_ID }} \
                    --zone=${{ env.GCP_ZONE }}

    benchmark:
        name: Run All Benchmarks
        needs: start-vm
        runs-on: [self-hosted, bench-vm]
        timeout-minutes: 120

        steps:
            - uses: actions/checkout@v4

            - name: Install dependencies
              run: bun install

            - name: Install Node.js dependencies
              run: npm install

            - name: Install oha
              run: |
                  wget https://github.com/hatoo/oha/releases/download/v1.11.0/oha-linux-amd64
                  chmod +x oha-linux-amd64
                  sudo mv oha-linux-amd64 /usr/local/bin/oha

            - name: Run benchmarks
              run: |
                  ulimit -n 65535
                  TIME="${{ inputs.time || '30' }}"
                  CONNECTIONS="${{ inputs.connections || '128' }}"
                  RUNS="${{ inputs.runs || '1' }}"
                  echo "Configuration: ${TIME}s duration, ${CONNECTIONS} connections, ${RUNS} runs"
                  bun run scripts/bench-single.ts --time=$TIME --connections=$CONNECTIONS --runs=$RUNS
              env:
                  NODE_ENV: production
                  PLATFORM: GCP (bench-vm)

            - name: Generate report
              run: bun run scripts/report.ts results/single.json docs/bench-single-gcp
              if: success()

            - name: Display results
              run: |
                  if [ -f docs/bench-single-gcp/README.md ] && [ -s docs/bench-single-gcp/README.md ]; then
                    grep -v '!\[.*\](.*\.svg)' docs/bench-single-gcp/README.md >> $GITHUB_STEP_SUMMARY
                  else
                    echo "⚠️ No results found or results file is empty" >> $GITHUB_STEP_SUMMARY
                  fi
              if: always()

            - name: Commit and push results
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add docs/bench-single-gcp/
                  if git diff --cached --quiet; then
                    echo "No changes to commit"
                  else
                    git commit -m "Update benchmark results - $(date +%Y-%m-%d)"
                    git push
                  fi
              if: success()

    stop-vm:
        name: Stop GCP VM
        needs: [start-vm, benchmark]
        if: always()
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - uses: actions/checkout@v4

            - name: Authenticate to Google Cloud
              uses: google-github-actions/auth@v3
              with:
                  project_id: ${{ secrets.GCP_PROJECT_ID }}
                  workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
                  service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

            - name: Setup gcloud
              uses: google-github-actions/setup-gcloud@v3.0.1

            - name: Stop VM instance
              run: |
                  echo "Stopping VM instance: ${{ env.VM_NAME }}"
                  gcloud compute instances stop ${{ env.VM_NAME }} \
                    --project=${{ env.GCP_PROJECT_ID }} \
                    --zone=${{ env.GCP_ZONE }} || true
